# Örnek akış — çok turlu ve üç katılımcılı planlama (PLANLAMA.md, aşama 6c).
#
# `plan2.yaml`den üç farkı var:
#
#   1. ÜÇ katılımcı: `planner` yazar, `architect` ve `analyst` itiraz eder.
#      Bir tur = bütün itirazcılar (zincir sırasında, birer birer) + yazarın
#      yanıtı.
#   2. İKİ tur: yazar yanıtladıktan sonra itirazcılar düzeltilmiş planı bir
#      kez daha okur. O tur yeni itiraz eklemezse alışveriş orada kapanır —
#      yazar boş bir aktivasyon harcamaz.
#   3. İlk tur KÖR (aşağıda).
#
# Tavan dolduğunda açık itiraz kalırsa kart KİLİT kapısına çıkar
# (`gate.kind: deadlock`): kod yerinde, insan planı olduğu gibi ileri
# bırakabilir ya da `retry` ile alışverişi yeniden açabilir.
#
# İLK TUR KÖR (6e, varsayılan). Körleme bir talimat değil TAŞIMA kuralı:
# körlü turda her itirazcının ağacı zincirden değil YAZARIN ağacından
# besleniyor (fan-out), turun sonunda hepsi yazarın ağacına katılıyor
# (fan-in). Yani ikinci itirazcı, birincinin itiraz dosyasını göremez —
# çünkü o dosya onun ağacında hiç yok. Her itirazcı kendi dosyasına yazıyor
# (`{rol}`); ortak tek dosya her fan-in'de çakışırdı.
#
# Kapatmak için: `ilk-tur-kor: false`. Kapalıyken taşıma zincir boyunca
# ileri gider ve ikinci itirazcı birincinin itirazlarını okur.

name: plan3
description: Üç katılımcı iki tur boyunca planı tartışır, sonra kod yazılır.

constitution:
  - ../prompts/constitution/base.md
  - ../prompts/constitution/engineering-ts.md

roles:
  - id: planner
    provider: claude
    workspace: main
    prompt: ../prompts/roles/planner.md
    receive: task
    next: architect

  - id: architect
    provider: claude
    workspace: architect
    prompt: ../prompts/roles/plan-itiraz.md
    receive: task
    next: analyst

  - id: analyst
    provider: claude
    workspace: analyst
    prompt: ../prompts/roles/plan-itiraz.md
    receive: task
    next: coder

  - id: coder
    provider: claude
    workspace: coder
    prompt: ../prompts/roles/coder.md
    receive: task
    reject: planner
    next: reviewer

  - id: reviewer
    provider: claude
    workspace: reviewer
    prompt: ../prompts/roles/reviewer.md
    receive: batch
    syncBack: [coder]
    reject: coder
    next: done

planlama:
  katilimcilar: [planner, architect, analyst]  # ilki yazar, ötekiler itiraz eder
  tur: 2                                       # tavan; doğal son daha erken gelebilir
  ilk-tur-kor: true                            # varsayılan; fan-out/fan-in taşıma
  plan: docs/plan/{kart}.md                    # itirazlar: docs/plan/{kart}.itiraz.md

reject:
  limit: 2
  onExhausted: gate

audit:
  enabled: false

# Maliyet, en kötü hâl: 2 tur × (2 itirazcı + 1 yanıt) + plan yazma = 7
# planlama aktivasyonu, üstüne coder + reviewer = 9. Doğal son ikinci turu
# yazar turuna varmadan kapatırsa 8'e düşer. Bu, `plan2.yaml`in neredeyse
# iki katı — 6d ölçümünün cevaplayacağı soru tam olarak bunun değip
# değmediği.

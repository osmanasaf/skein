# Örnek akış — 2 adım, kapısız. Günlük iş.
#
# Şema: SCHEMA.md
# Rol isimleri serbesttir; sistem isme bakıp davranış değiştirmez.
# Kopyalayıp kendi akışını yaz — derinliği ve isimleri sen belirlersin.

name: daily
description: Günlük sürücü. Üretim ve denetim kasıtlı olarak farklı sağlayıcıda.

# Tüm rollerin üstünde kanun. Sıra anlamlı; yollar bu dosyaya göre çözülür.
#
# Mühendislik maddesi DİLE ÖZELDİR ve akışın kararıdır. Bu akış Skein'in
# kendi deposunda (TypeScript) koşmak için; başka bir dilde koşacaksan
# `engineering-ts.md` yerine kendi maddeni koy.
constitution:
  - ../prompts/constitution/base.md
  - ../prompts/constitution/engineering-ts.md

roles:
  - id: coder
    provider: claude
    workspace: main             # ana checkout; tam olarak bir rol alır
    prompt: ../prompts/roles/coder.md
    receive: task
    next: reviewer

  - id: reviewer
    provider: codex             # KASITLI farklı sağlayıcı: farklı kör nokta
    workspace: reviewer         # kendi git worktree'si
    prompt: ../prompts/roles/reviewer.md
    receive: batch              # kuyruktaki eşdeğer işleri tek turda yut
    syncBack: [coder]           # merge-only kopya; maliyeti görünür
    reject: coder               # itiraz varsa KART geri döner, gerekçesiyle
    next: done                  # zinciri kapatır

gates: []                       # kapı yok; kod zaten senin önünden geçiyor

reject:
  limit: 2                      # aynı kenarda en fazla 2 ret
  onExhausted: gate             # sonra karar senin; sessizce geçmez

audit:
  enabled: true
  fingerprint: [task, recipients, commit, draft]

# Maliyet: ~5 aktivasyon/kart (2 rol × 2 audit turu + 1 syncBack).
# Her ret coder+reviewer parçasını yeniden koşturur: +4. Limit 2 → en kötü ~13.

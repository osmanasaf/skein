# Örnek akış — 2 adım, kapısız. Günlük iş.
#
# Şema: SCHEMA.md
# Rol isimleri serbesttir; sistem isme bakıp davranış değiştirmez.
# Kopyalayıp kendi akışını yaz — derinliği ve isimleri sen belirlersin.

name: daily
description: Günlük sürücü. Üretim ve denetim kasıtlı olarak farklı sağlayıcıda.

roles:
  - id: coder
    provider: claude
    workspace: main             # ana checkout; tam olarak bir rol alır
    prompt: roles/coder.prompt
    receive: task
    next: reviewer

  - id: reviewer
    provider: codex             # KASITLI farklı sağlayıcı: farklı kör nokta
    workspace: reviewer         # kendi git worktree'si
    prompt: roles/reviewer.prompt
    receive: batch              # kuyruktaki eşdeğer işleri tek turda yut
    syncBack: [coder]           # merge-only kopya; maliyeti görünür
    next: done                  # zinciri kapatır

gates: []                       # kapı yok; kod zaten senin önünden geçiyor

audit:
  enabled: true
  fingerprint: [task, recipients, commit, draft]

# Maliyet: ~5 aktivasyon/kart (2 rol × 2 audit turu + 1 syncBack)

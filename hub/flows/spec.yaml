# Örnek akış — 4 adım, spec kapılı. Gereksinim belirsizse.
#
# Bu dosyanın varlık sebebi: şemanın 2 adımla sınırlı olmadığını göstermek.
# Rol isimleri tamamen serbest — burada `analyst` ve `guard` kullanıldı,
# sistemin bildiği ayrıcalıklı isimler değiller. İnsan onay kapısı da
# herhangi bir role bağlanabiliyor.

name: spec
description: Yanlış şeyi inşa etme riski yüksek olduğunda. Kod yazılmadan önce insan onayı.

# Tüm rollerin üstünde kanun. Sıra anlamlı; yollar bu dosyaya göre çözülür.
constitution:
  - ../prompts/constitution/base.md
  - ../prompts/constitution/engineering-ts.md

roles:
  - id: analyst                 # "specifier" olmak zorunda değil
    provider: claude
    workspace: main
    prompt: ../prompts/roles/specifier.md
    receive: task
    next: coder

  - id: coder
    provider: codex
    workspace: coder
    prompt: ../prompts/roles/coder.md
    receive: task
    next: reviewer

  - id: reviewer
    provider: claude
    workspace: reviewer
    prompt: ../prompts/roles/reviewer.md
    receive: batch
    syncBack: [coder]
    reject: coder               # varsayılan zaten coder; açık yazıldı
    next: guard

  - id: guard                   # güvenlik/mimari son bakış
    provider: codex
    workspace: guard
    prompt: ../prompts/roles/guard.md
    receive: batch
    syncBack: [coder, reviewer] # açık liste: kimin uyanacağı sayılabilir
    reject: coder               # AÇIK: kusur kodda; gönderen reviewer'a değil,
                                # kodu yazana döner
    next: done

gates:
  - after: analyst              # kapı istediğin yere konur
    type: approval
    message: >
      Spec onaya hazır. Kabul kriterleri gözlemlenebilir mi, kapsam dışı
      doğru çizilmiş mi? Reddedersen iş analyst'e geri döner.

reject:
  limit: 2
  onExhausted: gate

audit:
  enabled: true
  fingerprint: [task, recipients, commit, draft]

# Maliyet: ~4 aktivasyon/kart (rol başına bir tur; syncBack ajan çağırmaz).
# Ret kenarları (başı dışında HER rol bir kenardır; varsayılan hedef gönderen):
# coder→analyst (+2), reviewer→coder (+2), guard→coder (+3). Limit 2 → en kötü ~18.
#
# Canlı koşuldu (17 Eylül, hepsi haiku): 4 aktivasyon, 4 dk 20 sn, $0.42.

# Topology B — spec-gated (3 roles, human approval before any code is written)
#
# Format: window-invisible <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
#
# Chain:  specifier --(HELD for human approval)--> coder --> cleaner --> Done
#             ^                                     ^          |
#             +--------- merge-only copies ---------+----------+
#
# Cost:   ~10 agent activations per card. Use it when the risk is building the
#         wrong thing, not when the risk is building it badly.
#
# The approval gate is NOT configurable in SwarmForge. It fires only when a
# role is literally named `specifier` AND sits on the `master` worktree AND
# sends to a single recipient. Rename or relocate that role and the gate
# silently disappears. See handoffd.bb `should-hold?`.

window-invisible specifier  claude  master
window-invisible coder      codex   coder
window-invisible cleaner    claude  cleaner  batch back-all

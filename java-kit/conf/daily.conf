# Topology A — daily driver (2 roles, no approval gate)
#
# Format: window-invisible <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
#
# Chain:  coder --(priority 50)--> cleaner --(priority 00, terminal)--> Done
#                    ^                                |
#                    +------- merge-only copy --------+
#
# Cost:   ~5 agent activations per card (2 forward passes x 2 audit rounds,
#         plus 1 merge-only delivery back to coder).
#
# Model diversity is deliberate: the role that reviews the work runs on a
# different model than the role that produced it, so it does not inherit the
# same blind spots. Swap the backends to whatever your environment allows,
# but keep them different.

window-invisible coder    claude  master
window-invisible cleaner  codex   cleaner  batch back-one
